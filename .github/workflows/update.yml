name: Update feed

on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов (UTC): 00/06/12/18 — 4 раза в день
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q feedparser pyyaml httpx trafilatura

      - name: Fetch new items
        run: python fetch.py

      - name: Summarize
        run: python summarize.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes — nothing to commit"
          else
            git commit -m "chore: update feed $(date -u +%F)"
            git push
          fi
